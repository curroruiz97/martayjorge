<!-- Fuente de public/assets/img/og.jpg (1200x630). Para regenerarla: copiar a public/_og.html, servir public/ y capturar a 1200x630 (ver README). -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="css/base.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{display:grid;grid-template-columns:1fr 470px;align-items:center;padding:0 80px 0 70px;gap:30px}
.t{display:grid;justify-items:center;gap:.5rem;text-align:center}
.n{font-family:var(--f-script);font-weight:700;font-size:188px;line-height:.78;display:grid;justify-items:center;letter-spacing:-.01em}
.n .a{transform:translateX(-.08em)} .n .b{transform:translateX(.1em)}
.n i{font-style:normal;font-size:.4em;font-weight:600;color:var(--terracota);transform:rotate(-8deg);line-height:1;margin-block:.06em}
.et{font:500 21px/1 var(--f-sans);letter-spacing:.3em;text-transform:uppercase;color:var(--tinta-suave)}
.et.f{margin-top:40px}
.foto{position:relative;width:420px;margin-left:20px;isolation:isolate}
.foto::before{content:"";position:absolute;inset:0;z-index:-1;border:1.5px solid var(--linea-fuerte);border-radius:999px 999px 8px 8px;transform:translate(14px,14px)}
.foto img{display:block;width:420px;height:525px;object-fit:cover;border-radius:999px 999px 8px 8px;filter:saturate(.93)}
</style></head><body>
<div class="t"><p class="et">¡Nos casamos!</p>
<div class="n"><span class="a">Marta</span><i>y</i><span class="b">Jorge</span></div>
<p class="et f">8 mayo 2027 · Valladolid</p></div>
<div class="foto"><img src="assets/img/hero-vertical-740.webp" alt=""></div>
</body></html>
